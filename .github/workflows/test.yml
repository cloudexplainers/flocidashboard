name: Test

on: [push, pull_request]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          --health-cmd /usr/local/bin/healthcheck.sh
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FLOCI_AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      FLOCI_AWS_PROFILE: ""
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: npm ci && npm run build && npm audit
        working-directory: frontend
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py test dashboard.integration_tests --noinput
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
          E2E_FLOCI_ENDPOINT: http://localhost:4566
      - run: npm run test:e2e:live
        working-directory: frontend
        env:
          E2E_PYTHON: python
          E2E_FLOCI_ENDPOINT: http://localhost:4566
