services:
  floci:
    image: floci/floci:latest
    pull_policy: always
    ports:
      - "${FLOCI_PORT:-4566}:4566"
      - "${FLOCI_ELASTICACHE_PORTS:-6379-6399}:6379-6399"
      - "${FLOCI_RDS_PORTS:-7001-7099}:7001-7099"
    environment:
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-hybrid}
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: ${FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED:-true}
      FLOCI_AUTH_VALIDATE_SIGNATURES: ${FLOCI_AUTH_VALIDATE_SIGNATURES:-true}
      FLOCI_SERVICES_S3_ENFORCE_AUTH: ${FLOCI_SERVICES_S3_ENFORCE_AUTH:-false}
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: floci_default
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: ${FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED:-true}
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dashboard:
    build:
      context: .
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,dashboard}
      FLOCI_DASHBOARD_DB: /app/data/db.sqlite3
      FLOCI_AWS_ENDPOINT_URL: http://floci:4566
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      FLOCI_AWS_PROFILE: ""
    volumes:
      - .:/app
      - dashboard-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
    name: floci_default

volumes:
  floci-data:
  dashboard-data:
